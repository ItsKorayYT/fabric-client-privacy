name: Build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the oldest supported Fabric API for 26.3
        run: ./gradlew test -PfabricApiVersion=0.160.5+26.3
      - run: ./gradlew clean build
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-client-privacy
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fabric-client-privacy
          path: dist
      - run: gh release create "$TAG" dist/*.jar --verify-tag --generate-notes --repo "$REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
