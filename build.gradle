plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.4'
}

version = '1.3.4+26.3'
group = 'io.github.itskorayyt'

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
}

def fabricApiVersion = providers.gradleProperty('fabricApiVersion').getOrElse('0.166.2+26.3')

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    compileOnly 'net.fabricmc.fabric-api:fabric-networking-api-v1:6.4.1+c58129785d'
    compileOnly('com.terraformersmc:modmenu:21.0.1') { transitive = false }
    runtimeOnly "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    testImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    testImplementation 'net.fabricmc:fabric-loader-junit:0.20.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

processResources {
    def modVersion = project.version.toString()
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand(version: modVersion) }
}

test {
    useJUnitPlatform()
    systemProperty 'test.fabricApiVersion', fabricApiVersion
}
jar { from('LICENSE') }
